# nginx/conf.d/supabase.conf
upstream supabase-studio {
    server supabase-studio:3000;
}
upstream supabase-auth {
    server supabase-auth:9999;
}
upstream supabase-rest {
    server supabase-rest:3000;
}
upstream supabase-realtime {
    server realtime-dev.supabase-realtime:4000;
}
upstream supabase-storage {
    server supabase-storage:5000;
}
upstream supabase-functions {
    server supabase-edge-functions:9000;
}
upstream supabase-analytics {
    server supabase-analytics:4000;
}
upstream supabase-meta {
    server supabase-meta:8080;
}

server {
    listen 80;
    server_name supabase.shop.co.kr;
    return 301 https://$server_name$request_uri;
}

# Internal routing server for docker network
server {
    listen 80;
    server_name nginx;
    
    # REST API - 더 구체적인 경로를 먼저 배치
    location /rest/v1/ {
        set $upstream_name "supabase-rest";
        proxy_pass http://supabase-rest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Auth routes (secure)
    location /auth/v1/ {
        set $upstream_name "supabase-auth";
        proxy_pass http://supabase-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Storage
    location /storage/v1/ {
        set $upstream_name "supabase-storage";
        proxy_pass http://supabase-storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Analytics
    location /analytics/v1/ {
        set $upstream_name "supabase-analytics";
        proxy_pass http://supabase-analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default return for unknown paths
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name supabase.shop.co.kr;
    
    # SSL 설정 추가
    ssl_certificate /etc/nginx/ssl/shop.co.kr_crt.pem;
    ssl_certificate_key /etc/nginx/ssl/shop.co.kr_key.pem;
    
    # CORS 헤더 추가
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Content-Profile, X-Client-Info' always;
    
    # OPTIONS 요청 처리
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # REST API - 더 구체적인 경로를 먼저 배치
    location /rest/v1/ {
        set $upstream_name "supabase-rest";
        proxy_pass http://supabase-rest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # GraphQL
    location /graphql/v1 {
        set $upstream_name "supabase-rest-graphql";
        proxy_pass http://supabase-rest/rpc/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Profile graphql_public;
    }

    # Auth routes (open) - 정규식 location
    location ~ ^/auth/v1/(verify|callback|authorize) {
        set $upstream_name "supabase-auth";
        proxy_pass http://supabase-auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Auth routes (secure)
    location /auth/v1/ {
        set $upstream_name "supabase-auth";
        proxy_pass http://supabase-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Realtime WebSocket
    location /realtime/v1/ {
        set $upstream_name "supabase-realtime";
        proxy_pass http://supabase-realtime/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
    
    # Realtime REST API
    location /realtime/v1/api {
        set $upstream_name "supabase-realtime-api";
        proxy_pass http://supabase-realtime/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Storage
    location /storage/v1/ {
        set $upstream_name "supabase-storage";
        proxy_pass http://supabase-storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Edge Functions
    location /functions/v1/ {
        set $upstream_name "supabase-functions";
        proxy_pass http://supabase-functions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Analytics
    location /analytics/v1/ {
        set $upstream_name "supabase-analytics";
        proxy_pass http://supabase-analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Meta API
    location /pg/ {
        set $upstream_name "supabase-meta";
        proxy_pass http://supabase-meta/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Studio (Dashboard) - catch-all은 마지막에
    location / {
        set $upstream_name "supabase-studio";
        proxy_pass http://supabase-studio/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}